<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Anmelden · Leadradar</title>
<link rel="stylesheet" href="/styles.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box {
    background: #fff; border: 1px solid var(--grau-200); border-radius: var(--radius-lg);
    padding: 32px 28px; width: 100%; max-width: 380px; box-shadow: var(--schatten-lg);
  }
  .login-logo { font-size: 40px; text-align: center; margin-bottom: 10px; }
  .login-box h1 { font-size: 21px; text-align: center; letter-spacing: -.02em; }
  .login-box p.sub { text-align: center; color: var(--grau-500); font-size: 13.5px; margin-bottom: 22px; }
  .login-box input { font-size: 16px; padding: 12px 13px; } /* 16px verhindert Zoom auf iOS */
  .login-error { margin-top: 14px; }
</style>
</head>
<body>

<form class="login-box" id="loginForm">
  <div class="login-logo">📡</div>
  <h1>Leadradar</h1>
  <p class="sub">Bitte Passwort eingeben</p>

  <div class="field">
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
  </div>

  <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginBtn">Anmelden</button>

  <div class="notice is-error login-error" id="loginError" hidden></div>
</form>

<script>
  const form = document.getElementById('loginForm');
  const fehler = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    fehler.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Prüfe …';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        location.href = '/';
        return;
      }
      fehler.textContent = data.error || 'Passwort stimmt nicht.';
      fehler.hidden = false;
    } catch (err) {
      fehler.textContent = 'Verbindung fehlgeschlagen: ' + err.message;
      fehler.hidden = false;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Anmelden';
      document.getElementById('pw').select();
    }
  });
</script>
</body>
</html>
