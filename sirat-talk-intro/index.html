<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Sirat Talk – Logo Intro</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ===========================================================
   SIRAT TALK – 12 s Logo Intro
   1920 x 1080, gedacht fuer 60 fps.

   Der Weg ist nicht als Strich gezeichnet, sondern es ist die
   echte Weg-Flaeche aus dem Logo: perspektivisch verjuengt,
   vorne breit, hinten schmal. Sie rollt sich vom Betrachter zum
   Horizont aus, die Kamera faehrt dabei zurueck und richtet sich
   auf, bis der Weg genau seine Groesse und Lage im Logo hat.
   Dann waechst das Logo aus ihm heraus.

   Alle Animationen haengen an derselben Master-Dauer (--dur),
   die Timeline steckt in den Keyframe-Prozenten.
   Farben: #E1272C  #FFFFFF  (+ Start-Hintergrund #2B0507)
   =========================================================== */
:root { --dur: 12s; --red: #E1272C; --white: #FFFFFF; --dark: #2B0507; }
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: #101010; overflow: hidden;
  font: 500 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #8a8a8a;
}
.wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }

#scene {
  position: relative; width: 1920px; height: 1080px; flex: none;
  overflow: hidden; background: var(--dark);
  transform-origin: 50% 50%;
  transform: scale(var(--fit, 1));      /* nur Vorschau, beim Export 1 */
}
svg.stage { position:absolute; inset:0; width:100%; height:100%; display:block; }

/* ---------- Kamera ---------- */
/* Zwei Kamera-Gruppen mit derselben Animation, damit der Wisch
   dazwischen liegen kann: er ist Bildschirmraum, keine Kamera. */
#camA, #camB { transform-box: view-box; transform-origin: 960px 540px; }
#scene.run #camA, #scene.run #camB { animation: camMove var(--dur) both; }

/* ---------- Der Weg ---------- */
#roadClipRect { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); }
#scene.run #roadClipRect { animation: unroll var(--dur) both; }
#roadShape { fill: var(--white); }
#lanes {
  fill: none; stroke: var(--red); stroke-width: 3.6; stroke-linecap: butt;
  stroke-dasharray: 4.2 9.0; stroke-dashoffset: 0; opacity: 0;
}
#scene.run #lanes { animation: lanes var(--dur) both; }

/* ---------- Weisser Wisch ---------- */
#wipe { transform: translateX(-3800px); }
#scene.run #wipe { animation: wipe var(--dur) both; }

/* ---------- Logo ---------- */
#logoWrap { opacity:0; transform-box:fill-box; transform-origin:50% 50%; }
#scene.run #logoWrap { animation: logoWrap var(--dur) both; }
#bubbleGrow { transform-box:fill-box; transform-origin:38.4% 100%; }
#scene.run #bubbleGrow { animation: bubbleGrow var(--dur) both; }
#siratClipRect { transform-box:fill-box; transform-origin:0% 50%; transform:scaleX(0); }
#scene.run #siratClipRect { animation: siratReveal var(--dur) both; }
#talk { opacity:0; transform-box:fill-box; transform-origin:50% 50%; }
#scene.run #talk { animation: talkIn var(--dur) both; }

/* ---------- Replay-Button, ausserhalb der Buehne ---------- */
#ui { display:flex; align-items:center; gap:14px; }
#replay {
  appearance:none; border:1px solid #3a3a3a; background:#1b1b1b; color:#e8e8e8;
  border-radius:999px; padding:9px 20px; font:inherit; font-weight:600;
  letter-spacing:.02em; cursor:pointer; transition:background .18s ease, border-color .18s ease;
}
#replay:hover { background:#262626; border-color:#545454; }
#hint { font-size:12px; color:#6a6a6a; }
body.export #ui { display:none; }
body.export { background:#000; }
body.export .wrap { gap:0; }

/* ===========================================================
   KEYFRAMES – Timeline (Master 12 s)
   0.00–0.20   dunkles Bild, die Kamera faehrt bereits
   0.20–4.60   der Weg rollt sich vom Betrachter zum Horizont aus
   0.50–7.05   die Markierungen laufen auf den Betrachter zu
   0.20–6.00   Kamera faehrt zurueck, 15.0 -> 4.95
   6.00–7.05   Weg faehrt auf Logo-Groesse und richtet sich auf
   6.35–6.95   weisser Wisch, waehrend der Weg noch Groesse hat
   6.88–8.25   die rote Blase waechst aus dem Weg; das Logo kommt mit
               der letzten Kamerabewegung zur Ruhe
   7.95–8.65   SIRAT wird freigelegt
   8.40–9.30   TALK faehrt ein
   9.30–10.60  Nachfedern 1.02 -> 1.0
   10.60–12.00 Ruhe
   =========================================================== */

@keyframes camMove {
  0% { transform: translate(2696.1px,-4167.3px) rotate(-24.0deg) scale(15.4); animation-timing-function: linear; }
  1.6667% { transform: translate(2626.1px,-4059.0px) rotate(-24.0deg) scale(15.0); animation-timing-function: cubic-bezier(.38,0,.24,1); }
  13.3333% { transform: translate(2030.9px,-3024.7px) rotate(-24.0deg) scale(11.6); }
  25% { transform: translate(1480.1px,-2065.8px) rotate(-24.0deg) scale(8.4); }
  38.3333% { transform: translate(1027.6px,-1293.6px) rotate(-24.0deg) scale(5.7); animation-timing-function: cubic-bezier(.36,0,.28,1); }
  50% { transform: translate(892.4px,-1123.4px) rotate(-24.0deg) scale(4.95); animation-timing-function: cubic-bezier(.42,0,.22,1); }
  58.75% { transform: translate(0px,0px) rotate(0deg) scale(1); animation-timing-function: linear; }
  100% { transform: translate(0px,0px) rotate(0deg) scale(1); }
}

@keyframes unroll {
  0%        { transform: scaleY(0); animation-timing-function: steps(1); }
  1.6667% { transform: scaleY(0); animation-timing-function: cubic-bezier(.3,0,.5,1); }
  5.1667% { transform: scaleY(.14); animation-timing-function: cubic-bezier(.38,0,.24,1); }
  38.3333% { transform: scaleY(1); animation-timing-function: linear; }
  100%      { transform: scaleY(1); }
}

/* Markierungen laufen auf den Betrachter zu. Konstante Strassen-
   geschwindigkeit, die zum Schluss ausrollt. */
@keyframes lanes {
  0%        { stroke-dashoffset: 0;  opacity: 0; animation-timing-function: steps(1); }
  4.1667% { stroke-dashoffset: 0;  opacity: 0; animation-timing-function: cubic-bezier(.4,0,.3,1); }
  7.9167% { stroke-dashoffset: -5; opacity: 1; animation-timing-function: linear; }
  50% { stroke-dashoffset: -68; opacity: 1; animation-timing-function: cubic-bezier(.4,0,.3,1); }
  58.75% { stroke-dashoffset: -78; opacity: 1; animation-timing-function: linear; }
  100%      { stroke-dashoffset: -78; opacity: 1; }
}

@keyframes wipe {
  0%        { transform: translateX(-3800px); animation-timing-function: steps(1); }
  52.9167% { transform: translateX(-3800px); animation-timing-function: cubic-bezier(.45,0,.3,1); }
  57.3333% { transform: translateX(0px); animation-timing-function: linear; }
  100%      { transform: translateX(0px); }
}

@keyframes logoWrap {
  0%        { opacity:0; transform:scale(1.02); animation-timing-function: steps(1); }
  57.25% { opacity:0; transform:scale(1.02); animation-timing-function: steps(1); }
  57.3333% { opacity:1; transform:scale(1.02); animation-timing-function: linear; }
  77.5% { opacity:1; transform:scale(1.02); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  88.3333%{ opacity:1; transform:scale(1);    animation-timing-function: linear; }
  100%      { opacity:1; transform:scale(1); }
}

@keyframes bubbleGrow {
  0%        { transform:scale(.62); animation-timing-function: steps(1); }
  57.3333% { transform:scale(.62); animation-timing-function: cubic-bezier(.22,1.08,.36,1); }
  68.75% { transform:scale(1);   animation-timing-function: linear; }
  100%      { transform:scale(1); }
}

@keyframes siratReveal {
  0%        { transform:scaleX(0); animation-timing-function: steps(1); }
  66.25% { transform:scaleX(0); animation-timing-function: cubic-bezier(.45,0,.3,1); }
  70% { transform:scaleX(1); animation-timing-function: linear; }
  100%      { transform:scaleX(1); }
}

@keyframes talkIn {
  0%        { opacity:0; transform:translateX(-30px); animation-timing-function: steps(1); }
  70% { opacity:0; transform:translateX(-30px); animation-timing-function: cubic-bezier(.22,1,.36,1); }
  77.5% { opacity:1; transform:translateX(0);     animation-timing-function: linear; }
  100%      { opacity:1; transform:translateX(0); }
}
</style>
</head>
